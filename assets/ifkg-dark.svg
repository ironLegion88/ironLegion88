<svg role="img" aria-label="Food Knowledge Graph. RDF and a slightly tilted GraphQL block." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 112" width="340" height="112">
  <title>Food Knowledge Graph. RDF and a slightly tilted GraphQL block.</title>
  <rect width="340" height="112" fill="#482C30"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" text-anchor="middle" font-size="32" fill="#F4A1A5">
    <rect x="20" y="30" width="88" height="60" rx="5" fill="#2A2120" stroke="#CBB1A5" stroke-opacity=".65" stroke-width="1.2"/>
    <text x="64" y="70">RDF</text>
    <g transform="rotate(-4 219 60)">
      <rect x="118" y="30" width="202" height="60" rx="5" fill="#2A2120" stroke="#CBB1A5" stroke-opacity=".65" stroke-width="1.2"/>
      <text x="219" y="70">GraphQL</text>
    </g>
  </g>
</svg>
