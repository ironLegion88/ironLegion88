<svg role="img" aria-label="Food Knowledge Graph. RDF and a slightly tilted GraphQL block." xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 112" width="340" height="112">
  <title>Food Knowledge Graph. RDF and a slightly tilted GraphQL block.</title>
  <rect width="340" height="112" fill="#F5E1D8"/>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-weight="600" text-anchor="middle" font-size="32" fill="#9C3037">
    <rect x="20" y="30" width="88" height="60" rx="5" fill="#FFF9F2" stroke="#674E42" stroke-opacity=".65" stroke-width="1.2"/>
